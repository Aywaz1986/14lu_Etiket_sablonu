<input type="file" id="excel-tekil-input" accept=".xlsx,.xls,.csv" style="display:none" onchange="tekilExcelSecildi(event)">

<!-- EXCEL EŞLEŞTİRME / ÖNİZLEME MODAL -->
<div id="excel-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:14px;width:90%;max-width:680px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);">
    <div style="padding:18px 22px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
      <h3 style="font-size:1rem;font-weight:700;">📊 Excel Sütun Eşleştirme</h3>
      <button onclick="excelModalKapat()" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:#64748b;">✕</button>
    </div>
    <div style="padding:18px 22px;">
      <p style="font-size:.82rem;color:#64748b;margin-bottom:14px;">Sütunlar otomatik eşleştirildi. Gerekirse aşağıdan düzelt, ardından onaylayarak içe aktar.</p>

      <div id="excel-eslesme-alani" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;">
        <!-- JS ile doldurulur -->
      </div>

      <div style="font-size:.78rem;font-weight:700;color:#64748b;margin-bottom:8px;text-transform:uppercase;">Önizleme</div>
      <div id="excel-onizleme-baslik"></div>
      <div style="max-height:280px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;">
        <table id="excel-onizleme-tablo" style="width:100%;border-collapse:collapse;font-size:.78rem;">
        </table>
      </div>

      <div style="display:flex;gap:10px;margin-top:18px;">
        <button onclick="excelModalKapat()" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;font-weight:600;cursor:pointer;">İptal</button>
        <button onclick="excelIceAktar()" style="flex:2;padding:10px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;">✅ İçe Aktar</button>
      </div>
    </div>
  </div>
</div>
